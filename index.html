<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Free Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #070b14;
        }

        .page-wrapper {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Background Image Layer */
        .bg-layer {
            position: absolute;
            inset: -24px;
            z-index: 1;
        }

        .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: blur(8px) brightness(0.75) saturate(1.1);
            transform: scale(1.06);
            display: block;
        }

        /* Subtle Dark Overlay for UI/UX Contrast */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10, 15, 30, 0.25) 0%, rgba(5, 8, 18, 0.65) 100%);
            z-index: 2;
        }

        /* Center Glassmorphism Card */
        .ui-card {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 360px;
            padding: 36px 24px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-7px);
            }
        }

        /* Glowing Button */
        .glow-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 260px;
            padding: 16px 28px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-radius: 999px;
            background: linear-gradient(120deg, #ff007f, #7928ca, #00d4ff, #ff007f);
            background-size: 300% 300%;
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.65), 0 0 36px rgba(0, 212, 255, 0.45);
            animation: gradientFlow 4s ease infinite, glowPulse 2.2s ease-in-out infinite;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .glow-btn:hover,
        .glow-btn:active {
            transform: scale(1.05);
            box-shadow: 0 0 26px rgba(255, 0, 127, 0.9), 0 0 50px rgba(0, 212, 255, 0.75);
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 16px rgba(255, 0, 127, 0.65), 0 0 32px rgba(121, 40, 202, 0.5);
            }
            50% {
                box-shadow: 0 0 26px rgba(0, 212, 255, 0.85), 0 0 48px rgba(255, 0, 127, 0.7);
            }
        }

        @media (max-width: 480px) {
            .ui-card {
                padding: 30px 20px;
                border-radius: 22px;
            }

            .glow-btn {
                font-size: 16px;
                padding: 15px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="page-wrapper">
        <div class="bg-layer">
            <img
                src="https://ibb.co.com/BKdqZngd"
                alt="Background Image"
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80';"
            >
        </div>
        <div class="bg-overlay"></div>

        <section class="ui-card">
            <a
                href="https://tonicgoverness.com/jdj611b6k?key=b771257f4fb0085c78445fc78a54a093"
                class="glow-btn"
                rel="noopener noreferrer"
            >
                Get Free Card
            </a>
        </section>
    </main>
</body>
</html>
